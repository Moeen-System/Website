<style>
  /* Dashboard dark tokens. */
  :root {
    --ground: #131313; --background: #171717; --foreground: #FAFAFA; --muted-foreground: #A3A3A3; --faint: #737373;
    --muted: #202020; --field: #FFFFFF0A; --border: #262626; --strong-border: #404040; --ring: #737373;

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow-x: clip; }
  body {
    min-height: 100%; display: grid; place-items: center; padding: 48px 16px 88px;
    background: var(--ground); color: var(--foreground);
    font: 400 13px/20px "Inter", "IBM Plex Sans Arabic", ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: 'cv11', 'ss03'; -webkit-font-smoothing: antialiased;

    background-image: radial-gradient(circle, #333 .9px, transparent 1px); background-size: 16px 16px;

  main { position: relative; width: 100%; max-width: 440px; text-align: center; }
  main > :not(.stage) { position: relative; z-index: 1; }

  /* The mark in its construction frame. Guides run toward the edges of the window. */
  .stage { position: relative; margin: 0 auto 40px; width: min(260px, 64vw); direction: ltr; }
  .stage::before, .stage::after { content: ""; position: absolute; left: 50%; width: 200vw; transform: translateX(-50%); border-top: 1px solid var(--guide); transition: border-color .6s var(--ease);
    mask-image: linear-gradient(to right, transparent 20%, #000 40%, #000 60%, transparent 80%); -webkit-mask-image: linear-gradient(to right, transparent 20%, #000 40%, #000 60%, transparent 80%); }
  .stage::before { top: 16.67%; } .stage::after { bottom: 16.67%; }
  .stage .v { position: absolute; bottom: -36px; height: calc(100vh + 36px); border-left: 1px dashed var(--guide); transition: border-color .6s var(--ease);
    mask-image: linear-gradient(to top, transparent 0, #000 120px, #000 calc(100% - 40%), transparent); -webkit-mask-image: linear-gradient(to top, transparent 0, #000 120px, #000 calc(100% - 40%), transparent); }
  .stage .v.a { left: 13.1%; } .stage .v.b { right: 13.1%; }
  .mark { position: relative; display: block; width: 100%; height: auto; overflow: visible; }
  .hatch { stroke: #6B6B6B; stroke-width: 2.5; }
  .frame { stroke: #5C5C5C; stroke-width: 2; stroke-dasharray: 6 8; transition: stroke .6s var(--ease); }

  /* One wipe, right to left: the fill arrives as the outline leaves. */
  .outline, .fill { transition: clip-path var(--reveal) var(--ease); }
  .outline { clip-path: inset(0 0 0 0); opacity: .7; }
  .fill { clip-path: inset(0 0 0 100%); }
  .stage:hover .fill, body.filled .fill { clip-path: inset(0 0 0 0); }
  .stage:hover .outline, body.filled .outline { clip-path: inset(0 100% 0 0); }
  .stage:hover::before, .stage:hover::after, .stage:hover .v { border-color: #525252; }
  .stage:hover .frame { stroke: #737373; }

  h1 { font-size: 24px; line-height: 32px; font-weight: 510; letter-spacing: -0.01em; text-wrap: balance; }
  :lang(ar) h1 { letter-spacing: 0; line-height: 36px; }
  p.lead { margin: 10px auto 0; max-width: 34em; color: var(--muted-foreground); font-size: 13px; line-height: 20px; text-wrap: pretty; }
  :lang(ar) p.lead { line-height: 22px; }

  form { margin: 24px auto 0; display: flex; gap: 8px; max-width: 380px; }
  input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--field); color: var(--foreground);
    font: inherit; font-size: 13px; direction: ltr; text-align: start; outline: none; transition: border-color .15s var(--ease); }
  :lang(ar) input:placeholder-shown { text-align: right; }
  input::placeholder { color: var(--faint); }
  input:focus, input:focus-visible { outline: none; border-color: var(--ring); }
  input[aria-invalid="true"] { border-color: #F87171; }
  button.submit { height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-foreground);
    font: inherit; font-size: 13px; font-weight: 450; cursor: pointer; white-space: nowrap; box-shadow: 0 1px 2px #0000000D; transition: background .15s var(--ease); }
  button.submit:hover { background: var(--primary-hover); } button.submit:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  .status { min-height: 20px; margin-top: 10px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .status.ok::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-inline-end: 6px; border-radius: 50%; background: var(--blue); vertical-align: middle; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Language switch: one icon button, as the dashboard's ghost icon buttons. */
  .language { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
  .language:hover { background: #FFFFFF0D; color: var(--foreground); }

  @media (prefers-reduced-motion: reduce) { .fill, .outline, .frame, .stage::before, .stage::after, .stage .v { transition: none; } }
  @media (hover: none) { .fill { clip-path: inset(0 0 0 0); } .outline { clip-path: inset(0 100% 0 0); } }

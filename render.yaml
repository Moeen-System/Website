services:
  - type: web
    name: moeen-website
    runtime: static
    branch: production
    autoDeployTrigger: off
    buildCommand: node scripts/build_site.mjs
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /waitlist
        destination: /waitlist/index.html
    envVars:
      - key: WAITLIST_API_URL
        value: https://app.moeen.dev/api/public/actions
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://app.moeen.dev; connect-src 'self' https://app.moeen.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Cache-Control
        value: no-cache
